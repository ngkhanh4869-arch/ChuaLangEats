<script type="module">
        import { getCurrentUser, fetchSpots, reportItem, deleteItem } from './js/supabase.js?v=5';

        let currentUser = null;
        let currentReportSpotId = null;

        async function init() {
            const user = await getCurrentUser();
            currentUser = user;
            renderAuthArea(user, user?.profile);
            await loadFeed();
        }

        function renderAuthArea(user, profile) {
            const authArea = document.getElementById("authArea");
            if (!authArea) return;
            if (user) {
                const username = profile?.username || user?.user_metadata?.username || "Thành viên";
                const initial = username.charAt(0).toUpperCase();
                const badge = profile?.badge || user?.user_metadata?.badge || "Trang Cá Nhân";
                authArea.innerHTML = `
                    <a href="profile.html" class="flex items-center gap-1.5 hover:text-palette-ember">
                        <span class="w-6 h-6 rounded-full bg-palette-ember text-white flex items-center justify-center text-[11px] font-bold">${initial}</span>
                        <span>👤 ${escapeHtml(badge)}</span>
                    </a>`;
            } else {
                authArea.innerHTML = `<a href="login.html" class="bg-palette-ember text-white px-3 py-1.5 rounded-lg hover:bg-palette-ember/90 transition">Đăng Nhập</a>`;
            }
        }

        async function loadFeed() {
            const skeleton = document.getElementById("feedSkeleton");
            const empty = document.getElementById("feedEmpty");
            const list = document.getElementById("feedList");

            skeleton?.classList.remove("hidden");
            empty?.classList.add("hidden");
            list?.classList.add("hidden");

            try {
                const data = await fetchSpots();
                skeleton?.classList.add("hidden");

                if (!data || data.length === 0) {
                    empty?.classList.remove("hidden");
                    return;
                }

                if (list) {
                    list.classList.remove("hidden");
                    list.innerHTML = data.map((spot) => renderSpotCard(spot)).join("");
                    attachCardListeners();
                }
            } catch (err) {
                skeleton?.classList.add("hidden");
                if (list) {
                    list.classList.remove("hidden");
                    list.innerHTML = `<p class="text-xs text-rose-600 text-center py-10">Không tải được bảng tin: ${escapeHtml(err.message)}</p>`;
                }
            }
        }

        function renderSpotCard(spot) {
            const profile = spot.profiles || {};
            const reviews = spot.reviews || [];
            const reviewCount = reviews.length;
            const avgQuality = reviewCount
                ? reviews.reduce((sum, r) => sum + (r.quality_rating || 0), 0) / reviewCount
                : null;
            const avgHygiene = reviewCount
                ? reviews.reduce((sum, r) => sum + (r.hygiene_rating || 0), 0) / reviewCount
                : null;

            const images = [
                ...(spot.food_images || []).map((url) => ({ url, isMenu: false })),
                ...(spot.menu_image ? [{ url: spot.menu_image, isMenu: true }] : []),
            ];

            const tags = spot.tags || [];
            const canDelete = currentUser && currentUser.id === spot.created_by;
            const initial = (profile.username || "?").charAt(0).toUpperCase();

            return `
            <article class="bg-white border border-palette-cream rounded-2xl shadow-sm overflow-hidden">
                <div class="flex items-center gap-3 p-4">
                    <div class="w-10 h-10 shrink-0 rounded-full bg-palette-ember text-white flex items-center justify-center font-bold">${initial}</div>
                    <div class="min-w-0 flex-grow">
                        <div class="flex items-center gap-2 flex-wrap">
                            <p class="font-bold text-sm truncate">${escapeHtml(profile.username || "Ẩn danh")}</p>
                            ${profile.badge ? `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-palette-yolk/15 text-palette-yolk border border-palette-yolk/30">${escapeHtml(profile.badge)}</span>` : ""}
                        </div>
                        <p class="text-[11px] text-palette-matcha/50">${timeAgo(spot.created_at)}</p>
                    </div>
                    ${spot.category ? `<span class="shrink-0 text-[10px] font-semibold px-2 py-1 rounded-full bg-palette-tofu border border-palette-cream">${escapeHtml(spot.category)}</span>` : ""}
                </div>

                ${images.length > 0 ? `
                <div class="relative">
                    <div class="media-gallery flex overflow-x-auto snap-x snap-mandatory">
                        ${images.map((img) => `
                        <div class="snap-center shrink-0 w-full relative">
                            <img src="${img.url}" class="w-full h-60 object-cover" loading="lazy" alt="${escapeHtml(spot.name)}">
                            ${img.isMenu ? `<span class="absolute top-2 left-2 bg-palette-matcha text-white text-[10px] font-bold px-2 py-1 rounded-full">📋 Ảnh Menu / Bảng Giá</span>` : ""}
                        </div>`).join("")}
                    </div>
                </div>` : ""}

                <div class="p-4 space-y-3 text-xs">
                    <div>
                        <h2 class="font-bold text-base">${escapeHtml(spot.name)}</h2>
                        <p class="text-palette-matcha/60">${escapeHtml(spot.address || "")}${spot.distance_minutes != null ? ` · ${spot.distance_minutes} phút đi bộ` : ""}</p>
                    </div>

                    <div class="flex items-center gap-2 flex-wrap">
                        <span class="text-[11px] font-bold px-2.5 py-1 rounded-full bg-palette-ember/10 text-palette-ember">${formatVnd(spot.min_price)} - ${formatVnd(spot.max_price)} VNĐ</span>
                        <span class="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-palette-tofu border border-palette-cream">🛡️ Sạch Sẽ: ${avgHygiene != null ? avgHygiene.toFixed(1) + "/5.0" : "Chưa có đánh giá"}</span>
                        <span class="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-palette-tofu border border-palette-cream">⭐ Chất Lượng: ${avgQuality != null ? avgQuality.toFixed(1) + "/5.0" : "Chưa có đánh giá"}</span>
                    </div>

                    ${spot.description ? `<p class="leading-relaxed">${escapeHtml(spot.description)}</p>` : ""}

                    ${tags.length > 0 ? `
                    <div class="flex flex-wrap gap-1.5">
                        ${tags.map((tag) => `<span class="text-[11px] font-semibold px-2 py-1 rounded-full bg-palette-matcha/5 text-palette-matcha">#${escapeHtml(tag)}</span>`).join("")}
                    </div>` : ""}
                </div>

                <div class="flex items-center gap-2 px-4 pb-4 pt-1 border-t border-palette-cream">
                    <a href="index.html?spotId=${spot.id}" class="flex-1 text-center text-xs font-bold text-palette-matcha border border-palette-cream rounded-lg py-2 hover:bg-palette-tofu transition">📍 Xem trên Bản Đồ</a>
                    <button type="button" class="report-btn flex-1 text-xs font-bold text-palette-yolk border border-palette-yolk/30 rounded-lg py-2 hover:bg-palette-yolk/10 transition" data-spot-id="${spot.id}">🚩 Báo Cáo</button>
                    ${canDelete ? `<button type="button" class="delete-btn text-xs font-bold text-rose-600 border border-rose-200 rounded-lg py-2 px-3 hover:bg-rose-50 transition" data-spot-id="${spot.id}">🗑️ Xóa Bài</button>` : ""}
                </div>
            </article>`;
        }

        function attachCardListeners() {
            document.querySelectorAll(".report-btn").forEach((btn) => {
                btn.addEventListener("click", () => openReportModal(btn.dataset.spotId));
            });

            document.querySelectorAll(".delete-btn").forEach((btn) => {
                btn.addEventListener("click", () => handleDeleteSpot(btn.dataset.spotId));
            });
        }

        function openReportModal(spotId) {
            if (!currentUser) {
                window.location.href = "login.html";
                return;
            }
            currentReportSpotId = spotId;
            document.querySelectorAll('input[name="reportReason"]').forEach((r) => (r.checked = false));
            document.getElementById("reportError")?.classList.add("hidden");
            document.getElementById("reportModal")?.classList.remove("hidden");
        }

        window.closeReportModal = function () {
            document.getElementById("reportModal")?.classList.add("hidden");
            currentReportSpotId = null;
        };

        async function handleDeleteSpot(spotId) {
            if (!confirm("Xóa bài đăng này? Hành động không thể hoàn tác.")) return;
            try {
                await deleteItem("spot", spotId);
                loadFeed();
            } catch (err) {
                alert("Không thể xóa: " + err.message);
            }
        }

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str ?? "";
            return div.innerHTML;
        }

        function formatVnd(n) {
            if (n == null) return "0";
            return Number(n).toLocaleString("vi-VN");
        }

        function timeAgo(dateStr) {
            if (!dateStr) return "";
            const diffMs = Date.now() - new Date(dateStr).getTime();
            const minutes = Math.floor(diffMs / 60000);
            if (minutes < 1) return "Vừa xong";
            if (minutes < 60) return `${minutes} phút trước`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} giờ trước`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days} ngày trước`;
            return new Date(dateStr).toLocaleDateString("vi-VN", { year: "numeric", month: "long", day: "numeric" });
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", init);
        } else {
            init();
        }
    </script>
