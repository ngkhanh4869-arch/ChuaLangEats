<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Tin - ChùaLángEats</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        palette: {
                            ember: '#EE3F24',
                            cream: '#FFEFCB',
                            matcha: '#023820',
                            yolk: '#F9A11B',
                            tofu: '#FFF4E6',
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-palette-tofu text-palette-matcha font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- NAVBAR -->
    <header class="bg-white border-b border-palette-cream sticky top-0 z-50">
        <div class="max-w-2xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 font-bold text-lg">
                <span class="w-8 h-8 rounded-lg bg-palette-ember flex items-center justify-center p-1.5"><img src="assets/logo-mark.png" alt="ChùaLángEats" class="w-full h-full object-contain"></span>
                <span>ChùaLáng<span class="text-palette-ember">Eats</span></span>
            </a>
            <div class="flex items-center gap-3 sm:gap-4 text-xs font-semibold">
                <a href="index.html" class="hover:text-palette-ember">📍 Bản Đồ</a>
                <a href="add-spot.html" class="hover:text-palette-ember">➕ Thêm Quán</a>
                <div id="authArea"></div>
            </div>
        </div>
    </header>

    <!-- FEED MAIN CONTENT -->
    <main class="flex-grow max-w-2xl mx-auto w-full px-4 py-6">

        <!-- Skeleton loader -->
        <div id="feedSkeleton" class="space-y-4">
            <div class="bg-white border border-palette-cream rounded-2xl overflow-hidden animate-pulse">
                <div class="flex items-center gap-3 p-4">
                    <div class="w-10 h-10 rounded-full bg-palette-cream"></div>
                    <div class="flex-grow space-y-2">
                        <div class="h-3 w-24 bg-palette-cream rounded"></div>
                        <div class="h-2 w-16 bg-palette-cream rounded"></div>
                    </div>
                </div>
                <div class="h-56 bg-palette-cream"></div>
                <div class="p-4 space-y-2">
                    <div class="h-3 w-3/4 bg-palette-cream rounded"></div>
                    <div class="h-3 w-1/2 bg-palette-cream rounded"></div>
                    <div class="h-3 w-full bg-palette-cream rounded"></div>
                </div>
            </div>
        </div>

        <!-- Empty state -->
        <div id="feedEmpty" class="hidden text-center py-16">
            <div class="text-4xl mb-3">🍜</div>
            <p class="font-bold text-sm mb-2">Chưa có bài đăng nào</p>
            <p class="text-xs text-palette-matcha/60 mb-4">Hãy là người đầu tiên thêm quán!</p>
            <a href="add-spot.html" class="inline-block bg-palette-ember text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-md hover:bg-palette-ember/90 transition">+ Thêm Quán Ngay</a>
        </div>

        <!-- Real feed list -->
        <div id="feedList" class="hidden space-y-4"></div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-palette-matcha text-palette-cream text-center text-xs py-4 space-y-1">
        <p>© 2026 Chùa Láng Student Community</p>
        <a href="https://github.com/ngkhanh4869-arch/ChuaLangEats" target="_blank" rel="noopener noreferrer"
           class="block text-palette-cream/50 hover:text-palette-cream underline decoration-dotted underline-offset-4 transition">
            Một dự án Tư duy Thiết kế (Design Thinking) của sinh viên FTU, DAV & VYA
        </a>
    </footer>

    <!-- REPORT MODAL -->
    <div id="reportModal" class="hidden fixed inset-0 bg-black/40 z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-lg max-w-sm w-full p-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-sm">Báo Cáo Quán Ăn</h3>
                <button type="button" onclick="closeReportModal()" class="text-palette-matcha/50 hover:text-palette-matcha text-lg leading-none">✕</button>
            </div>
            <form id="reportForm" class="space-y-3 text-xs">
                <label class="flex items-center gap-2 border border-palette-cream rounded-xl p-3 cursor-pointer hover:bg-palette-tofu transition">
                    <input type="radio" name="reportReason" value="Quán đã đóng cửa" class="accent-palette-ember">
                    <span>Quán đã đóng cửa</span>
                </label>
                <label class="flex items-center gap-2 border border-palette-cream rounded-xl p-3 cursor-pointer hover:bg-palette-tofu transition">
                    <input type="radio" name="reportReason" value="Giá sai thực tế" class="accent-palette-ember">
                    <span>Giá sai thực tế</span>
                </label>
                <label class="flex items-center gap-2 border border-palette-cream rounded-xl p-3 cursor-pointer hover:bg-palette-tofu transition">
                    <input type="radio" name="reportReason" value="Nội dung vi phạm" class="accent-palette-ember">
                    <span>Nội dung vi phạm</span>
                </label>
                <p id="reportError" class="hidden text-palette-ember font-semibold"></p>
                <button type="submit" id="reportSubmitBtn" class="w-full bg-palette-ember hover:bg-palette-ember/90 text-white font-bold py-2.5 rounded-xl shadow-md transition disabled:opacity-70">Gửi Báo Cáo</button>
            </form>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-palette-matcha text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-lg z-[70]"></div>

    <!-- MODULE SCRIPT -->
    <script type="module">
        import { getCurrentUser, fetchSpots, reportItem, deleteItem } from './js/supabase.js?v=6';

        let currentUser = null;
        let currentReportSpotId = null;

        async function init() {
            try {
                const { user, profile } = await getCurrentUser();
                currentUser = user;
                renderAuthArea(user, profile);
            } catch (e) {
                console.error("Auth init error:", e);
                renderAuthArea(null, null);
            }
            await loadFeed();
        }

        function renderAuthArea(user, profile) {
            const authArea = document.getElementById("authArea");
            if (!authArea) return;

            if (user) {
                const username = profile?.username || user?.user_metadata?.username || "Thành viên";
                const initial = username.charAt(0).toUpperCase();
                const badge = profile?.badge || user?.user_metadata?.badge || "Sinh Viên Verified";
                
                authArea.innerHTML = `
                    <a href="profile.html" class="flex items-center gap-1.5 hover:text-palette-ember">
                        <span class="w-6 h-6 rounded-full bg-palette-ember text-white flex items-center justify-center text-[11px] font-bold">${initial}</span>
                        <span>👤 ${escapeHtml(badge)}</span>
                    </a>`;
            } else {
                authArea.innerHTML = `<a href="login.html" class="bg-palette-ember text-white px-3 py-1.5 rounded-lg hover:bg-palette-ember/90 transition">Đăng Nhập</a>`;
            }
        }

        async function loadFeed() {
            const skeleton = document.getElementById("feedSkeleton");
            const empty = document.getElementById("feedEmpty");
            const list = document.getElementById("feedList");

            skeleton?.classList.remove("hidden");
            empty?.classList.add("hidden");
            list?.classList.add("hidden");

            try {
                const { data, error } = await fetchSpots();
                skeleton?.classList.add("hidden");

                if (error) {
                    if (list) {
                        list.classList.remove("hidden");
                        list.innerHTML = `<p class="text-xs text-palette-ember text-center py-10">Không tải được bảng tin: ${escapeHtml(error.message)}</p>`;
                    }
                    return;
                }

                const spots = data || [];

                if (spots.length === 0) {
                    empty?.classList.remove("hidden");
                    return;
                }

                if (list) {
                    list.classList.remove("hidden");
                    list.innerHTML = spots.map((spot) => renderSpotCard(spot)).join("");
                    attachCardListeners();
                }
            } catch (err) {
                console.error("Feed load error:", err);
                skeleton?.classList.add("hidden");
                if (list) {
                    list.classList.remove("hidden");
                    list.innerHTML = `<p class="text-xs text-palette-ember text-center py-10">Không tải được bảng tin: ${escapeHtml(err.message || String(err))}</p>`;
                }
            }
        }

        function renderSpotCard(spot) {
            const profile = spot.profiles || {};
            const reviews = spot.reviews || [];
            const reviewCount = reviews.length;
            const avgQuality = reviewCount
                ? reviews.reduce((sum, r) => sum + (r.quality_rating || 0), 0) / reviewCount
                : null;
            const avgHygiene = reviewCount
                ? reviews.reduce((sum, r) => sum + (r.hygiene_rating || 0), 0) / reviewCount
                : null;

            const images = [
                ...(spot.food_images || []).map((url) => ({ url, isMenu: false })),
                ...(spot.menu_image ? [{ url: spot.menu_image, isMenu: true }] : []),
            ];

            const tags = spot.tags || [];
            const canDelete = currentUser && currentUser.id === spot.created_by;
            const initial = (profile.username || "?").charAt(0).toUpperCase();

            return `
            <article class="bg-white border border-palette-cream rounded-2xl shadow-sm overflow-hidden">
                <div class="flex items-center gap-3 p-4">
                    <div class="w-10 h-10 shrink-0 rounded-full bg-palette-ember text-white flex items-center justify-center font-bold">${initial}</div>
                    <div class="min-w-0 flex-grow">
                        <div class="flex items-center gap-2 flex-wrap">
                            <p class="font-bold text-sm truncate">${escapeHtml(profile.username || "Ẩn danh")}</p>
                            ${profile.badge ? `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-palette-yolk/15 text-palette-yolk border border-palette-yolk/30">${escapeHtml(profile.badge)}</span>` : ""}
                        </div>
                        <p class="text-[11px] text-palette-matcha/50">${timeAgo(spot.created_at)}</p>
                    </div>
                    ${spot.category ? `<span class="shrink-0 text-[10px] font-semibold px-2 py-1 rounded-full bg-palette-tofu border border-palette-cream">${escapeHtml(spot.category)}</span>` : ""}
                </div>

                ${images.length > 0 ? `
                <div class="relative">
                    <div class="media-gallery flex overflow-x-auto snap-x snap-mandatory">
                        ${images.map((img) => `
                        <div class="snap-center shrink-0 w-full relative">
                            <img src="${img.url}" class="w-full h-60 object-cover" loading="lazy" alt="${escapeHtml(spot.name)}">
                            ${img.isMenu ? `<span class="absolute top-2 left-2 bg-palette-matcha text-white text-[10px] font-bold px-2 py-1 rounded-full">📋 Ảnh Menu / Bảng Giá</span>` : ""}
                        </div>`).join("")}
                    </div>
                    ${images.length > 1 ? `
                    <button type="button" class="gallery-prev absolute left-2 top-1/2 -translate-y-1/2 w-7 h-7 bg-white/90 rounded-full shadow text-sm flex items-center justify-center">‹</button>
                    <button type="button" class="gallery-next absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 bg-white/90 rounded-full shadow text-sm flex items-center justify-center">›</button>
                    <div class="gallery-dots absolute bottom-2 left-1/2 -translate-x-1/2 flex gap-1">
                        ${images.map((_, i) => `<span class="w-1.5 h-1.5 rounded-full ${i === 0 ? "bg-white" : "bg-white/50"}"></span>`).join("")}
                    </div>` : ""}
                </div>` : ""}

                <div class="p-4 space-y-3 text-xs">
                    <div>
                        <h2 class="font-bold text-base">${escapeHtml(spot.name)}</h2>
                        <p class="text-palette-matcha/60">${escapeHtml(spot.address || "")}${spot.distance_minutes != null ? ` · ${spot.distance_minutes} phút đi bộ` : ""}</p>
                    </div>

                    <div class="flex items-center gap-2 flex-wrap">
                        <span class="text-[11px] font-bold px-2.5 py-1 rounded-full bg-palette-ember/10 text-palette-ember">${formatVnd(spot.min_price)} - ${formatVnd(spot.max_price)} VNĐ</span>
                        <span class="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-palette-tofu border border-palette-cream">🛡️ Sạch Sẽ: ${avgHygiene != null ? avgHygiene.toFixed(1) + "/5.0" : "Chưa có đánh giá"}</span>
                        <span class="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-palette-tofu border border-palette-cream">⭐ Chất Lượng: ${avgQuality != null ? avgQuality.toFixed(1) + "/5.0" : "Chưa có đánh giá"}</span>
                    </div>

                    ${spot.description ? `<p class="leading-relaxed">${escapeHtml(spot.description)}</p>` : ""}

                    ${tags.length > 0 ? `
                    <div class="flex flex-wrap gap-1.5">
                        ${tags.map((tag) => `<span class="text-[11px] font-semibold px-2 py-1 rounded-full bg-palette-matcha/5 text-palette-matcha">#${escapeHtml(tag)}</span>`).join("")}
                    </div>` : ""}
                </div>

                <div class="flex items-center gap-2 px-4 pb-4 pt-1 border-t border-palette-cream">
                    <a href="index.html?spotId=${spot.id}" class="flex-1 text-center text-xs font-bold text-palette-matcha border border-palette-cream rounded-lg py-2 hover:bg-palette-tofu transition">📍 Xem trên Bản Đồ</a>
                    <button type="button" class="report-btn flex-1 text-xs font-bold text-palette-yolk border border-palette-yolk/30 rounded-lg py-2 hover:bg-palette-yolk/10 transition" data-spot-id="${spot.id}">🚩 Báo Cáo</button>
                    ${canDelete ? `<button type="button" class="delete-btn text-xs font-bold text-palette-ember border border-palette-ember/30 rounded-lg py-2 px-3 hover:bg-palette-ember/10 transition" data-spot-id="${spot.id}">🗑️ Xóa Bài</button>` : ""}
                </div>
            </article>`;
        }

        function attachCardListeners() {
            document.querySelectorAll(".media-gallery").forEach(setupGallery);

            document.querySelectorAll(".report-btn").forEach((btn) => {
                btn.addEventListener("click", () => openReportModal(btn.dataset.spotId));
            });

            document.querySelectorAll(".delete-btn").forEach((btn) => {
                btn.addEventListener("click", () => handleDeleteSpot(btn.dataset.spotId));
            });
        }

        function setupGallery(gallery) {
            const wrapper = gallery.parentElement;
            const prevBtn = wrapper.querySelector(".gallery-prev");
            const nextBtn = wrapper.querySelector(".gallery-next");
            const dots = wrapper.querySelectorAll(".gallery-dots span");

            function updateDots() {
                if (!dots.length) return;
                const index = Math.round(gallery.scrollLeft / gallery.clientWidth);
                dots.forEach((dot, i) => {
                    dot.className = `w-1.5 h-1.5 rounded-full ${i === index ? "bg-white" : "bg-white/50"}`;
                });
            }

            prevBtn?.addEventListener("click", () => gallery.scrollBy({ left: -gallery.clientWidth, behavior: "smooth" }));
            nextBtn?.addEventListener("click", () => gallery.scrollBy({ left: gallery.clientWidth, behavior: "smooth" }));
            gallery.addEventListener("scroll", () => requestAnimationFrame(updateDots));
        }

        function openReportModal(spotId) {
            if (!currentUser) {
                window.location.href = "login.html";
                return;
            }
            currentReportSpotId = spotId;
            document.querySelectorAll('input[name="reportReason"]').forEach((r) => (r.checked = false));
            document.getElementById("reportError")?.classList.add("hidden");
            document.getElementById("reportModal")?.classList.remove("hidden");
        }

        window.closeReportModal = function () {
            document.getElementById("reportModal")?.classList.add("hidden");
            currentReportSpotId = null;
        };

        const reportForm = document.getElementById("reportForm");
        if (reportForm) {
            reportForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const selected = document.querySelector('input[name="reportReason"]:checked');
                const reportError = document.getElementById("reportError");

                if (!selected) {
                    if (reportError) {
                        reportError.textContent = "Vui lòng chọn một lý do.";
                        reportError.classList.remove("hidden");
                    }
                    return;
                }

                const submitBtn = document.getElementById("reportSubmitBtn");
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.textContent = "Đang gửi...";
                }

                try {
                    const { error } = await reportItem("spot", currentReportSpotId, selected.value);
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.textContent = "Gửi Báo Cáo";
                    }
                    if (error) {
                        if (reportError) {
                            reportError.textContent = "Không thể gửi báo cáo: " + error.message;
                            reportError.classList.remove("hidden");
                        }
                        return;
                    }
                    window.closeReportModal();
                    showToast("Đã gửi báo cáo. Cảm ơn bạn!");
                } catch (err) {
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.textContent = "Gửi Báo Cáo";
                    }
                    if (reportError) {
                        reportError.textContent = "Không thể gửi báo cáo: " + err.message;
                        reportError.classList.remove("hidden");
                    }
                }
            });
        }

        async function handleDeleteSpot(spotId) {
            if (!confirm("Xóa bài đăng này? Hành động không thể hoàn tác.")) return;
            try {
                const { error } = await deleteItem("spot", spotId);
                if (error) {
                    alert("Không thể xóa: " + error.message);
                    return;
                }
                loadFeed();
            } catch (err) {
                alert("Không thể xóa: " + err.message);
            }
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            if (!toast) return;
            toast.textContent = message;
            toast.classList.remove("hidden");
            setTimeout(() => toast.classList.add("hidden"), 2500);
        }

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str ?? "";
            return div.innerHTML;
        }

        function formatVnd(n) {
            if (n == null) return "0";
            return Number(n).toLocaleString("vi-VN");
        }

        function timeAgo(dateStr) {
            if (!dateStr) return "";
            const diffMs = Date.now() - new Date(dateStr).getTime();
            const minutes = Math.floor(diffMs / 60000);
            if (minutes < 1) return "Vừa xong";
            if (minutes < 60) return `${minutes} phút trước`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} giờ trước`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days} ngày trước`;
            return new Date(dateStr).toLocaleDateString("vi-VN", { year: "numeric", month: "long", day: "numeric" });
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", init);
        } else {
            init();
        }
    </script>
</body>
</html>
