<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Cá Nhân - ChùaLángEats</title>
    <!-- Google Fonts Preconnect First -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        palette: {
                            ember: '#EE3F24',
                            cream: '#FFEFCB',
                            matcha: '#023820',
                            yolk: '#F9A11B',
                            tofu: '#FFF4E6',
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-palette-tofu text-palette-matcha font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- NAVBAR -->
    <header class="bg-white border-b border-palette-cream sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 font-bold text-lg">
                <span class="w-8 h-8 rounded-lg bg-palette-ember text-white flex items-center justify-center text-sm"><i class="fa-solid fa-utensils"></i></span>
                <span>ChùaLáng<span class="text-palette-ember">Eats</span></span>
            </a>
            <div class="flex items-center gap-4 text-xs font-semibold">
                <a href="feed.html" class="hover:text-palette-ember">📱 Feed</a>
                <a href="add-spot.html" class="hover:text-palette-ember">➕ Thêm Quán</a>
                <button type="button" onclick="handleLogout()" class="bg-palette-cream text-palette-ember px-3 py-1.5 rounded-lg border border-palette-yolk/30 hover:bg-palette-yolk/20 transition">Đăng Xuất</button>
            </div>
        </div>
    </header>

    <!-- PROFILE CONTENT -->
    <main class="flex-grow max-w-3xl mx-auto w-full px-4 py-8 sm:py-10">

        <!-- PROFILE CARD -->
        <div class="bg-white border border-palette-cream rounded-2xl shadow-sm p-5 sm:p-6 mb-6">
            <div id="profileAlert" class="hidden text-xs p-3 rounded-xl mb-4"></div>

            <!-- Display mode -->
            <div id="profileDisplay" class="flex items-center gap-4">
                <div id="avatarInitial" class="w-16 h-16 shrink-0 rounded-full bg-palette-ember text-white flex items-center justify-center text-2xl font-bold">?</div>
                <div class="min-w-0 flex-grow">
                    <p id="displayUsername" class="font-bold text-lg truncate">—</p>
                    <span id="displayBadge" class="inline-block mt-1 text-xs font-semibold px-3 py-1 rounded-full bg-palette-yolk/15 text-palette-yolk border border-palette-yolk/30">—</span>
                    <p id="joinedDate" class="text-xs text-palette-matcha/60 mt-2">—</p>
                </div>
                <button type="button" onclick="toggleEditProfile()" class="shrink-0 text-xs font-bold text-palette-matcha border border-palette-cream rounded-lg px-3 py-2 hover:bg-palette-tofu transition">Chỉnh Sửa</button>
            </div>

            <!-- Edit mode -->
            <form id="editProfileForm" onsubmit="handleProfileUpdate(event)" class="hidden space-y-4 text-xs">
                <div>
                    <label for="editBadgeSelect" class="block font-semibold mb-1">Trường học / Huy hiệu Badge</label>
                    <select id="editBadgeSelect" class="w-full bg-palette-tofu border border-palette-cream rounded-xl p-3 font-medium focus:ring-2 focus:ring-palette-ember focus:outline-none">
                        <option value="FTUer Verified">Sinh viên Ngoại Thương (FTUer)</option>
                        <option value="DAVer Verified">Sinh viên Ngoại Giao (DAVer)</option>
                        <option value="VYAer Verified">Sinh viên Thanh thiếu niên (VYAer)</option>
                        <option value="Sinh Viên Verified">Sinh viên Trường khác</option>
                    </select>
                    <p class="text-palette-matcha/50 mt-1">Tên tài khoản không thể thay đổi sau khi đăng ký.</p>
                </div>
                <div class="flex gap-2">
                    <button type="submit" class="flex-1 bg-palette-ember hover:bg-palette-ember/90 text-white font-bold py-2.5 rounded-xl shadow-md transition">Lưu Thay Đổi</button>
                    <button type="button" onclick="toggleEditProfile()" class="flex-1 border border-palette-cream font-bold py-2.5 rounded-xl hover:bg-palette-tofu transition">Hủy</button>
                </div>
            </form>
        </div>

        <!-- ACTIVITY -->
        <div class="bg-white border border-palette-cream rounded-2xl shadow-sm p-5 sm:p-6">
            <div class="flex border-b border-palette-cream mb-4">
                <button id="tabSpots" type="button" onclick="switchProfileTab('spots')" class="flex-1 py-2 font-bold text-sm text-palette-ember border-b-2 border-palette-ember transition">Quán Của Tôi</button>
                <button id="tabReviews" type="button" onclick="switchProfileTab('reviews')" class="flex-1 py-2 font-bold text-sm text-palette-matcha/50 hover:text-palette-matcha transition">Đánh Giá Của Tôi</button>
            </div>

            <div id="panelSpots" class="space-y-3">
                <p class="text-xs text-palette-matcha/50 text-center py-6">Đang tải...</p>
            </div>

            <div id="panelReviews" class="hidden space-y-3">
                <p class="text-xs text-palette-matcha/50 text-center py-6">Đang tải...</p>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="bg-palette-matcha text-palette-cream text-center text-xs py-4">
        <p>© 2026 Chùa Láng Student Community</p>
    </footer>

    <script type="module">
        import { supabase, getCurrentUser, signOutUser, deleteItem } from './js/supabase.js';

        let currentUser = null;
        let currentProfile = null;

        init();

        async function init() {
            const { user, profile } = await getCurrentUser();

            if (!user || !user.id) {
                window.location.href = "login.html";
                return;
            }

            currentUser = user;
            currentProfile = profile || {};
            renderProfile(currentProfile, currentUser);
            loadMySpots();
            loadMyReviews();
        }

        function renderProfile(profile, user) {
            const username = profile?.username || user?.user_metadata?.username || "Thành viên";
            const badge = profile?.badge || user?.user_metadata?.badge || "Chưa xác thực";

            const avatarElem = document.getElementById("avatarInitial");
            if (avatarElem) avatarElem.textContent = username.charAt(0).toUpperCase();

            const nameElem = document.getElementById("displayUsername");
            if (nameElem) nameElem.textContent = username;

            const badgeElem = document.getElementById("displayBadge");
            if (badgeElem) badgeElem.textContent = badge;

            const badgeSelect = document.getElementById("editBadgeSelect");
            if (badgeSelect) badgeSelect.value = badge;

            const joinedRaw = profile?.created_at || user?.created_at;
            const joined = joinedRaw
                ? new Date(joinedRaw).toLocaleDateString("vi-VN", { year: "numeric", month: "long", day: "numeric" })
                : "—";
            const joinedElem = document.getElementById("joinedDate");
            if (joinedElem) joinedElem.textContent = `Tham gia từ ${joined}`;
        }

        window.toggleEditProfile = function() {
            document.getElementById("profileDisplay")?.classList.toggle("hidden");
            document.getElementById("editProfileForm")?.classList.toggle("hidden");
        };

        window.handleProfileUpdate = async function(e) {
            e.preventDefault();
            const alertBox = document.getElementById("profileAlert");
            const newBadge = document.getElementById("editBadgeSelect")?.value;

            if (!currentUser || !currentUser.id) {
                alert("Vui lòng đăng nhập lại.");
                window.location.href = "login.html";
                return;
            }

            const { error } = await supabase
                .from("profiles")
                .update({ badge: newBadge })
                .eq("id", currentUser.id);

            if (alertBox) alertBox.classList.remove("hidden");
            if (error) {
                if (alertBox) {
                    alertBox.textContent = "Không thể lưu: " + error.message;
                    alertBox.className = "text-xs p-3 rounded-xl mb-4 bg-rose-100 text-rose-700 font-semibold";
                }
            } else {
                currentProfile.badge = newBadge;
                renderProfile(currentProfile, currentUser);
                if (alertBox) {
                    alertBox.textContent = "Đã lưu thay đổi!";
                    alertBox.className = "text-xs p-3 rounded-xl mb-4 bg-emerald-100 text-emerald-800 font-semibold";
                }
                window.toggleEditProfile();
            }
        };

        window.switchProfileTab = function(type) {
            const panelSpots = document.getElementById("panelSpots");
            const panelReviews = document.getElementById("panelReviews");
            const tabSpots = document.getElementById("tabSpots");
            const tabReviews = document.getElementById("tabReviews");

            const activeClass = "flex-1 py-2 font-bold text-sm text-palette-ember border-b-2 border-palette-ember transition";
            const inactiveClass = "flex-1 py-2 font-bold text-sm text-palette-matcha/50 hover:text-palette-matcha transition";

            if (type === "spots") {
                panelSpots?.classList.remove("hidden");
                panelReviews?.classList.add("hidden");
                if (tabSpots) tabSpots.className = activeClass;
                if (tabReviews) tabReviews.className = inactiveClass;
            } else {
                panelReviews?.classList.remove("hidden");
                panelSpots?.classList.add("hidden");
                if (tabReviews) tabReviews.className = activeClass.replace("border-palette-ember", "border-palette-matcha").replace("text-palette-ember", "text-palette-matcha");
                if (tabSpots) tabSpots.className = inactiveClass;
            }
        };

        async function loadMySpots() {
            const container = document.getElementById("panelSpots");
            if (!container) return;

            if (!currentUser || !currentUser.id) {
                container.innerHTML = `<p class="text-xs text-palette-matcha/50 text-center py-6">Vui lòng đăng nhập để xem danh sách quán.</p>`;
                return;
            }

            const { data, error } = await supabase
                .from("spots")
                .select("*")
                .eq("created_by", currentUser.id)
                .order("created_at", { ascending: false });

            if (error) {
                container.innerHTML = `<p class="text-xs text-rose-600 text-center py-6">Không tải được danh sách quán: ${escapeHtml(error.message)}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8">
                        <p class="text-sm font-semibold text-palette-matcha/70 mb-2">Bạn chưa thêm quán nào</p>
                        <a href="add-spot.html" class="text-xs font-bold text-palette-ember hover:underline">+ Thêm quán đầu tiên của bạn</a>
                    </div>`;
                return;
            }

            container.innerHTML = data.map((spot) => `
                <div class="flex items-center justify-between gap-3 border border-palette-cream rounded-xl p-3">
                    <div class="min-w-0">
                        <p class="font-bold text-sm truncate">${escapeHtml(spot.name)}</p>
                        <p class="text-xs text-palette-matcha/60 truncate">${escapeHtml(spot.address ?? "")}</p>
                        <span class="inline-block mt-1 text-[10px] font-semibold px-2 py-0.5 rounded-full ${spot.status === "approved" ? "bg-emerald-100 text-emerald-700" : "bg-palette-yolk/20 text-palette-yolk"}">
                            ${spot.status === "approved" ? "Đã duyệt" : "Chờ duyệt"}
                        </span>
                    </div>
                    <button type="button" onclick="removeSpot(${spot.id})" class="shrink-0 text-xs font-semibold text-rose-600 hover:text-rose-700 px-2 py-1">Xóa</button>
                </div>
            `).join("");
        }

        async function loadMyReviews() {
            const container = document.getElementById("panelReviews");
            if (!container) return;

            if (!currentUser || !currentUser.id) {
                container.innerHTML = `<p class="text-xs text-palette-matcha/50 text-center py-6">Vui lòng đăng nhập để xem đánh giá.</p>`;
                return;
            }

            const { data, error } = await supabase
                .from("reviews")
                .select("*, spots ( name )")
                .eq("user_id", currentUser.id)
                .order("created_at", { ascending: false });

            if (error) {
                container.innerHTML = `<p class="text-xs text-rose-600 text-center py-6">Không tải được đánh giá: ${escapeHtml(error.message)}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8">
                        <p class="text-sm font-semibold text-palette-matcha/70 mb-2">Bạn chưa viết đánh giá nào</p>
                        <a href="feed.html" class="text-xs font-bold text-palette-ember hover:underline">Khám phá quán để đánh giá</a>
                    </div>`;
                return;
            }

            container.innerHTML = data.map((review) => `
                <div class="flex items-start justify-between gap-3 border border-palette-cream rounded-xl p-3">
                    <div class="min-w-0">
                        <p class="font-bold text-sm truncate">${escapeHtml(review.spots?.name ?? "Quán đã bị xóa")}</p>
                        <p class="text-xs text-palette-matcha/60">Chất lượng ${review.quality_rating ?? "–"}/5 · Vệ sinh ${review.hygiene_rating ?? "–"}/5</p>
                        ${review.comment ? `<p class="text-xs mt-1">${escapeHtml(review.comment)}</p>` : ""}
                    </div>
                    <button type="button" onclick="removeReview(${review.id})" class="shrink-0 text-xs font-semibold text-rose-600 hover:text-rose-700 px-2 py-1">Xóa</button>
                </div>
            `).join("");
        }

        window.removeSpot = async function(id) {
            if (!confirm("Xóa quán này? Hành động không thể hoàn tác.")) return;
            const { error } = await deleteItem("spot", id);
            if (error) {
                alert("Không thể xóa: " + error.message);
            } else {
                loadMySpots();
            }
        };

        window.removeReview = async function(id) {
            if (!confirm("Xóa đánh giá này?")) return;
            const { error } = await deleteItem("review", id);
            if (error) {
                alert("Không thể xóa: " + error.message);
            } else {
                loadMyReviews();
            }
        };

        window.handleLogout = async function() {
            await signOutUser();
            window.location.href = "login.html";
        };

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str ?? "";
            return div.innerHTML;
        }
    </script>
</body>
</html>
