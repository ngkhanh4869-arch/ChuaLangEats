<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Quán Mới - ChùaLángEats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        palette: {
                            ember: '#EE3F24',
                            cream: '#FFEFCB',
                            matcha: '#023820',
                            yolk: '#F9A11B',
                            tofu: '#FFF4E6',
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-palette-tofu text-palette-matcha font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- NAVBAR -->
    <header class="bg-white border-b border-palette-cream sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 font-bold text-lg">
                <span class="w-8 h-8 rounded-lg bg-palette-ember text-white flex items-center justify-center text-sm"><i class="fa-solid fa-utensils"></i></span>
                <span>ChùaLáng<span class="text-palette-ember">Eats</span></span>
            </a>
            <div class="flex items-center gap-4 text-xs font-semibold">
                <a href="feed.html" class="hover:text-palette-ember">📱 Feed</a>
                <a href="profile.html" class="hover:text-palette-ember">👤 Trang Cá Nhân</a>
            </div>
        </div>
    </header>

    <!-- ADD SPOT CONTENT -->
    <main class="flex-grow max-w-2xl mx-auto w-full px-4 py-8">
        <div class="bg-white border border-palette-cream rounded-2xl shadow-sm p-6 sm:p-8">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-xl font-bold">Thêm Quán Mới</h1>
                <a href="feed.html" class="text-xs font-semibold text-palette-matcha/70 hover:text-palette-ember">← Quay lại Feed</a>
            </div>

            <div id="alertBox" class="hidden text-xs p-3 rounded-xl mb-4"></div>

            <form id="addSpotForm" class="space-y-4 text-xs">
                <div>
                    <label class="block font-semibold mb-1">Tên Quán *</label>
                    <input type="text" id="spotName" required placeholder="Ví dụ: Bún Trộn Ngõ 84 Chùa Láng" class="w-full bg-palette-tofu border border-palette-cream rounded-xl p-3 font-medium focus:ring-2 focus:ring-palette-ember focus:outline-none">
                </div>

                <div>
                    <label class="block font-semibold mb-1">Địa Chỉ *</label>
                    <input type="text" id="spotAddress" required placeholder="Số 12 Ngõ 84 Chùa Láng" class="w-full bg-palette-tofu border border-palette-cream rounded-xl p-3 font-medium focus:ring-2 focus:ring-palette-ember focus:outline-none">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-semibold mb-1">Danh Mục *</label>
                        <select id="spotCategory" required class="w-full bg-palette-tofu border border-palette-cream rounded-xl p-3 font-medium focus:ring-2 focus:ring-palette-ember focus:outline-none">
                            <option value="Ăn Trưa">Ăn Trưa</option>
                            <option value="Ăn Sáng">Ăn Sáng</option>
                            <option value="Ăn Tối">Ăn Tối</option>
                            <option value="Ăn Vặt">Ăn Vặt</option>
                            <option value="Cà Phê / Trà Sữa">Cà Phê / Trà Sữa</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold mb-1">Bữa Ăn *</label>
                        <select id="spotMealType" required class="w-full bg-palette-tofu border border-palette-cream rounded-xl p-3 font-medium focus:ring-2 focus:ring-palette-ember focus:outline-none">
                            <option value="lunch">Cơm / Bún / Phở</option>
                            <option value="snack">Ăn Nhẹ / Đồ Uống</option>
                            <option value="breakfast">Ăn Sáng Nhanh</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-semibold mb-1">Giá Tối Thiểu (VNĐ)</label>
                        <input type="number" id="spotMinPrice" placeholder="20000" class="w-full bg-palette-tofu border border-palette-cream rounded-xl p-3 font-medium focus:ring-2 focus:ring-palette-ember focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1">Giá Tối Đa (VNĐ)</label>
                        <input type="number" id="spotMaxPrice" placeholder="35000" class="w-full bg-palette-tofu border border-palette-cream rounded-xl p-3 font-medium focus:ring-2 focus:ring-palette-ember focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block font-semibold mb-1">Khoảng Cách Từ Cổng Trường (phút đi bộ)</label>
                    <input type="number" id="spotDistance" placeholder="3" class="w-full bg-palette-tofu border border-palette-cream rounded-xl p-3 font-medium focus:ring-2 focus:ring-palette-ember focus:outline-none">
                </div>

                <div>
                    <label class="block font-semibold mb-1">Mô Tả / Review Ngắn</label>
                    <textarea id="spotDescription" rows="3" placeholder="Quán có gì đặc biệt? Giá sinh viên không?" class="w-full bg-palette-tofu border border-palette-cream rounded-xl p-3 font-medium focus:ring-2 focus:ring-palette-ember focus:outline-none"></textarea>
                </div>

                <div>
                    <label class="block font-semibold mb-1">Ảnh Món Ăn</label>
                    <input type="file" id="spotFoodFiles" multiple accept="image/*" class="w-full text-xs text-palette-matcha/70 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-palette-cream file:text-palette-ember cursor-pointer">
                </div>

                <div>
                    <label class="block font-semibold mb-1">Ảnh Menu (nếu có)</label>
                    <input type="file" id="spotMenuFile" accept="image/*" class="w-full text-xs text-palette-matcha/70 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-palette-cream file:text-palette-ember cursor-pointer">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-palette-ember hover:bg-palette-ember/90 text-white font-bold py-3 rounded-xl shadow-md transition mt-4">
                    Gửi Đề Xuất Quán
                </button>
            </form>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-palette-matcha text-palette-cream text-center text-xs py-4">
        <p>© 2026 Chùa Láng Student Community</p>
    </footer>

    <script type="module">
        import { getCurrentUser, createSpot } from './js/supabase.js?v=5';

        async function initAddSpot() {
            const alertBox = document.getElementById("alertBox");
            const form = document.getElementById("addSpotForm");
            const submitBtn = document.getElementById("submitBtn");

            const user = await getCurrentUser();
            if (!user) {
                alertBox.classList.remove("hidden");
                alertBox.textContent = "Bạn cần đăng nhập để thêm quán ăn. Đang chuyển hướng...";
                alertBox.className = "text-xs p-3 rounded-xl mb-4 bg-amber-100 text-amber-800 font-semibold";
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1200);
                return;
            }

            form.onsubmit = async (e) => {
                e.preventDefault();
                submitBtn.disabled = true;
                submitBtn.textContent = "Đang tải dữ liệu...";

                alertBox.classList.add("hidden");

                try {
                    const spotData = {
                        name: document.getElementById("spotName").value.trim(),
                        address: document.getElementById("spotAddress").value.trim(),
                        category: document.getElementById("spotCategory").value,
                        mealType: document.getElementById("spotMealType").value,
                        minPrice: document.getElementById("spotMinPrice").value || 0,
                        maxPrice: document.getElementById("spotMaxPrice").value || 0,
                        distanceMinutes: document.getElementById("spotDistance").value || 5,
                        description: document.getElementById("spotDescription").value.trim(),
                        tags: []
                    };

                    const foodFiles = Array.from(document.getElementById("spotFoodFiles").files);
                    const menuFile = document.getElementById("spotMenuFile").files[0] || null;

                    await createSpot(spotData, foodFiles, menuFile);

                    alertBox.textContent = "Thêm quán thành công! Quán đang chờ duyệt.";
                    alertBox.className = "text-xs p-3 rounded-xl mb-4 bg-emerald-100 text-emerald-800 font-semibold";
                    alertBox.classList.remove("hidden");

                    setTimeout(() => {
                        window.location.href = "profile.html";
                    }, 1500);
                } catch (err) {
                    alertBox.textContent = "Lỗi khi thêm quán: " + err.message;
                    alertBox.className = "text-xs p-3 rounded-xl mb-4 bg-rose-100 text-rose-700 font-semibold";
                    alertBox.classList.remove("hidden");
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Gửi Đề Xuất Quán";
                }
            };
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initAddSpot);
        } else {
            initAddSpot();
        }
    </script>
</body>
</html>
